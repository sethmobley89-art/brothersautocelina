<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brother's Automotive | Celina, Ohio Auto Repair</title>
  <meta name="description" content="Brother's Automotive, 415 W Logan St in Celina, Ohio. Honest local auto repair and maintenance. Call (419) 584-0707 to schedule service.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="keywords" content="Brother's Automotive Celina Ohio, auto repair Celina OH, mechanic Celina, 415 W Logan St">

  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --bg-dark: #000000;
      --bg-mid: #111111;
      --border: #e5e5e5;
      --text: #111111;
      --text-muted: #666666;
      --accent: #ffffff;
      --accent-inverse: #000000;
      --max-width: 1120px;
      --radius: 6px;
      --shadow-soft: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(0,0,0,0.96);
      color: #ffffff;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
    }

    .top-bar {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.4rem 1rem;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: #d4d4d4;
    }

    .top-bar strong {
      font-weight: 600;
    }

    .top-bar a {
      color: #ffffff;
      font-weight: 600;
    }

    nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.7rem 1rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .nav-links {
      display: flex;
      gap: 1.4rem;
      font-size: 0.9rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #e5e5e5;
      opacity: 0.85;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid currentColor;
      cursor: pointer;
      background: transparent;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease, box-shadow 0.08s ease;
      white-space: nowrap;
    }

    .btn-light {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .btn-light:hover {
      background: #f5f5f5;
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.55);
    }

    .btn-outline-light {
      color: #ffffff;
      border-color: #ffffff;
    }

    .btn-outline-light:hover {
      background: #ffffff;
      color: #000000;
    }

    .btn-dark {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .btn-dark:hover {
      background: #111111;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    main {
      min-height: 100vh;
    }

    /* HERO */

    .hero {
      background: #000000;
      color: #ffffff;
      padding: 3.2rem 1rem 3.4rem;
      border-bottom: 1px solid #111111;
    }

    .hero-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 2.4rem;
      align-items: center;
    }

    .hero-label {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a3a3a3;
      margin-bottom: 0.7rem;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 3vw + 1.1rem, 3rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero h1 span {
      color: #ffffff;
    }

    .hero p {
      font-size: 0.98rem;
      color: #d4d4d4;
      max-width: 32rem;
      margin-bottom: 1.5rem;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      font-size: 0.8rem;
      color: #a3a3a3;
    }

    .hero-card {
      background: #050505;
      border-radius: 10px;
      border: 1px solid #1f1f1f;
      padding: 1.4rem 1.3rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #3f3f3f;
      font-size: 0.78rem;
      color: #d4d4d4;
      margin-bottom: 0.7rem;
    }

    .hero-card h2 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .hero-card p {
      font-size: 0.86rem;
      color: #b3b3b3;
      margin-bottom: 0.7rem;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.78rem;
      margin-top: 0.3rem;
    }

    .hero-tags span {
      border-radius: 999px;
      border: 1px solid #2b2b2b;
      padding: 0.2rem 0.6rem;
      color: #e5e5e5;
    }

    /* SECTIONS */

    section {
      padding: 3rem 1rem;
    }
